<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card UI Design</title>
    <link rel="stylesheet" href="style.css" />

    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link />
  </head>

  <body>
    <div class="profile-card">
      <div class="image">
        <img src="try1.png" class="profile-img" />
      </div>

      <div class="text-data">
        <span class="name">Estevão Bernardo</span>
        <span class="job">Desenvolvedor Web</span>
      </div>

      <div class="social-media">
        <a href="#" style="background: #ff0000"
          ><i class="bx bxl-youtube"></i
        ></a>
        <a href="#" style="background: #333"><i class="bx bxl-github"></i></a>
        <a href="#" style="background: #e1306c"
          ><i class="bx bxl-instagram"></i
        ></a>
        <a href="#" style="background: #0077b5"
          ><i class="bx bxl-linkedin"></i
        ></a>
      </div>

      <div class="buttons">
        <a href="#" class="btn">Seguir</a>
        <a href="#" class="btn">Mensagem</a>
      </div>

      <div class="analytics">
        <div class="data">
          <i class="bx bxs-heart"></i>
          <span class="number">78K</span>
        </div>

        <div class="data">
          <i class="bx bxs-message-rounded"></i>
          <span class="number">60K</span>
        </div>

        <div class="data">
          <i class="bx bxs-share"></i>
          <span class="number">35K</span>
        </div>
      </div>
    </div>
  </body>
</html>
